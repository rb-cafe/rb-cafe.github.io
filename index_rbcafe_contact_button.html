<style>
body{background:#7a3d28}
.landing{min-height:100vh;max-width:1100px;margin:auto;padding:28px 22px 35px;position:relative;overflow:hidden;color:#f1e5d1}
.landing:before{content:"";position:absolute;left:-160px;top:120px;width:430px;height:600px;border:1px solid rgba(241,229,209,.10);border-radius:50%;transform:rotate(-25deg)}
.brand-logo{display:block;width:210px;height:auto;margin:0 0 5px auto;position:relative;z-index:1}
.landing-content{max-width:560px;margin:65px auto 0;text-align:center;position:relative;z-index:1}
.landing-buttons{display:flex;flex-direction:column;gap:13px;margin-top:28px}
.landing-btn{display:flex;align-items:center;justify-content:center;gap:14px;background:#ead8bd;color:#71371f;border:0;border-radius:18px;padding:16px 20px;font-size:20px;font-weight:700;font-family:Tahoma,Arial,sans-serif;cursor:pointer;box-shadow:0 7px 18px rgba(50,20,10,.10)}
.landing-btn:hover{transform:translateY(-1px)}
.landing-btn .ico{font-size:22px}
.tagline{margin-top:36px;font-size:24px;letter-spacing:1px;color:#ead8bd;display:flex;align-items:center;justify-content:center;gap:15px}
.tagline:before,.tagline:after{content:"";width:70px;height:1px;background:#ead8bd;opacity:.75}
#menu{background:#7a3d28;color:#f1e5d1;border-radius:28px 28px 0 0;margin-top:0;padding-top:28px}
.back-btn{display:block;margin:0 auto 15px;background:#7a3d28;color:#fff;border:0;border-radius:20px;padding:9px 18px;font-family:inherit;cursor:pointer}
@media(max-width:600px){
.landing{padding:22px 16px 30px}
.brand-logo{width:175px}
.landing-content{margin-top:45px}
.landing-btn{font-size:18px;padding:15px}
.tagline{font-size:21px}
}
</style>

<style>
/* شعار وحركة دخول ناعمة */
.landing .brand-logo{
  animation: logoFade 0.9s ease-out both;
}
.landing-content{
  animation: contentFade 0.8s ease-out 0.35s both;
}
.landing-buttons .landing-btn{
  opacity:0;
  animation: buttonFade 0.55s ease-out both;
}
.landing-buttons .landing-btn:nth-child(1){animation-delay:.45s}
.landing-buttons .landing-btn:nth-child(2){animation-delay:.55s}
.landing-buttons .landing-btn:nth-child(3){animation-delay:.65s}
.landing-buttons .landing-btn:nth-child(4){animation-delay:.75s}
.landing-buttons .landing-btn:nth-child(5){animation-delay:.85s}
.tagline{animation: taglineFade .7s ease-out 1s both}
@keyframes logoFade{from{opacity:0;transform:translateY(-12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes contentFade{from{opacity:0}to{opacity:1}}
@keyframes buttonFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes taglineFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>

<style>
/* اللمسات النهائية */
.landing-btn,.tabs button,.back-btn,.links a{transition:transform .18s ease,box-shadow .18s ease,background .18s ease,opacity .18s ease}
.landing-btn:hover,.tabs button:hover,.back-btn:hover,.links a:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(50,20,10,.12)}
.landing-btn:active,.tabs button:active,.back-btn:active,.links a:active{transform:scale(.97)}
.landing-btn{gap:12px;text-decoration:none}
.btn-icon{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:21px;line-height:1}
.order-btn{box-shadow:0 9px 24px rgba(50,20,10,.16)}
#menu{animation:none}
.menu-enter{animation:menuEnter .48s ease-out both}
.menu-exit{animation:menuExit .35s ease-in both}
@keyframes menuEnter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes menuExit{from{opacity:1;transform:none}to{opacity:0;transform:translateY(12px)}}
@media(max-width:600px){
  .landing-content{max-width:440px}
  .landing-buttons{gap:11px}
  .landing-btn{min-height:54px;border-radius:16px}
  .menu-icon{font-size:20px}
  #menu{padding-left:10px;padding-right:10px}
  .tabs{padding-left:2px;padding-right:2px}
  .card{border-radius:14px}
}
</style>
